<!DOCTYPE html>
<html lang="sv">
<head>

<title>GeoR</title>
<style>
:root{color-scheme:dark;--bg:#0d1514;--panel:#15211f;--panel2:#1b2b28;--text:#f2f5f1;--muted:#b8c5bf;--gold:#d7b56d;--green:#58a982;--brown:#bd805a;--blue:#7c9fd6;--line:#38504a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:minmax(300px,390px) 1fr;min-height:100vh}.side{padding:20px;background:linear-gradient(180deg,var(--panel),#101918);border-right:1px solid var(--line);overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#20332f;border:1px solid #50675f;font-size:1.45rem}h1{font-size:1.65rem;margin:0}.subtitle{margin:3px 0 0;color:var(--muted);font-size:.88rem}.search{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #4b625c;background:#12201d;color:var(--text);font:inherit;margin-bottom:12px}.entry{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);cursor:pointer}.entry.active,.entry:hover{border-color:var(--gold);box-shadow:0 0 0 2px rgba(215,181,109,.12)}.entry h2{font-size:1.05rem;margin:0 0 4px}.meta,.summary{color:var(--muted);font-size:.85rem;line-height:1.45}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid #536a64;border-radius:999px;padding:3px 7px;font-size:.72rem;color:#d3ddd8}.main{padding:16px;overflow:auto}.mapcard{max-width:1050px;margin:auto;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 70% 15%,#274239,#13221f 58%,#0e1716);overflow:hidden}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(15,25,23,.82)}.toolbar h2{margin:0;font-size:1.1rem}.btn{display:inline-flex;padding:9px 12px;border-radius:999px;border:1px solid #536a64;background:#20332f;color:var(--text);text-decoration:none;font-size:.85rem}.content{display:grid;grid-template-columns:1fr 320px;min-height:620px}svg{width:100%;height:100%;min-height:620px}.route{fill:none;stroke:#eadbb1;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.halo{fill:#0d1514;stroke:#f3f0e7;stroke-width:1.4}.dot.start,.dot.mål{fill:var(--gold)}.dot.natur{fill:var(--green)}.dot.kultur{fill:var(--brown)}.dot.utsikt{fill:var(--blue)}.marker{cursor:pointer}.marker text{fill:#f4f6f2;font-size:15px;paint-order:stroke;stroke:#0d1514;stroke-width:5px;stroke-linejoin:round}.marker:hover .halo,.marker.active .halo{stroke:var(--gold);stroke-width:4}.detail{padding:18px;border-left:1px solid var(--line);background:rgba(17,29,26,.9)}.detail h3{margin:0 0 6px}.detail p{line-height:1.48}.small{color:var(--muted);font-size:.86rem}.badge{display:inline-block;border:1px solid #536a64;border-radius:999px;padding:3px 8px;color:var(--muted);font-size:.76rem}@media(max-width:820px){.app{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.content{display:block}.detail{border-left:0;border-top:1px solid var(--line)}svg{min-height:520px}.main{padding:8px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">⌖</div><div><h1>GeoR</h1><p class="subtitle">Rese- och upptäcktskartor</p></div></div><input class="search" id="search" type="search" placeholder="Sök resa, plats eller tema"><div id="list"></div></aside><main class="main"><section class="mapcard"><div class="toolbar"><div><h2 id="mapTitle">Sarpsborg till Beito</h2><div class="small">5 augusti 2026 · Østfold, Hadeland och Valdres</div></div><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=Oscar+Pedersens+vei+45,+Sarpsborg&destination=Lykkjetjednet+12,+Beitost%C3%B8len&waypoints=Hadeland+Glassverk%7CKistefos+Museum%7CH%C3%B8nefoss%7CBagn%7CFagernes%7CHegge+stavkirke&travelmode=driving">Navigation</a></div><div class="content"><svg viewBox="0 0 900 760" role="img" aria-label="Schematisk karta från Sarpsborg till Beito"><path d="M40 660C140 570 160 430 260 350C350 280 430 210 520 130C610 60 720 45 860 60V700C720 730 560 715 420 710C260 705 130 710 40 660Z" fill="#284139" opacity=".55"/><polyline class="route" points="70,690 75,686 365,395 375,403 420,420 645,235 662,218 760,145 838,80 860,66 868,48" id="route"/><g id="markers"></g><text x="70" y="730" fill="#9fb2aa" font-size="14">Schematisk karta. Använd navigation för exakt körväg.</text></svg><aside class="detail" id="detail"><h3>Välj en hållpunkt</h3><p class="small">Klicka på en punkt eller ett namn i kartan för sammanhang, tidsåtgång och länk till platsen.</p></aside></div></section></main></div>
<script>
const trips=[{id:'sarpsborg-beito-2026-08-05',title:'Sarpsborg till Beito',date:'5 augusti 2026',region:'Østfold, Hadeland och Valdres',tags:['bilresa','natur','kultur','Norge'],summary:'Naturskön färd från Borregård Hotell i Sarpsborg till Beito, med valbara stopp vid Kistefos, Hadeland, stavkyrkor och Fagernes.'}];
const stops=[
['Borregård Hotell',70,690,'start','Start','Start i Sarpsborg, Oscar Pedersens vei 45.','Historisk herrgårdsmiljö nära Glomma.','Oscar Pedersens vei 45 Sarpsborg'],
['Sarpefossen',75,686,'natur','10 till 20 min','Mäktig fors i Glomma nära starten.','Dramatisk natur och industrihistoria.','Sarpefossen Sarpsborg'],
['Hadeland Glassverk',365,395,'kultur','30 till 90 min','Historiskt glasbruk med glasblåsning, hantverk och kafé.','Tydligt kulturstopp med låg tröskel.','Hadeland Glassverk Jevnaker'],
['Kistefos',375,403,'kultur','60 till 150 min','Industrimuseum, skulpturpark och samtidskonst kring Randselva.','Natur, historia, konst och arkitektur i samma stopp.','Kistefos Museum Jevnaker'],
['Hønefossen',420,420,'natur','15 till 30 min','Lättillgänglig fors mitt i Hønefoss.','Bra bensträckare längs vägen.','Hønefossen Hønefoss'],
['Bagn Bygdesamling',645,235,'kultur','30 till 75 min','Friluftsmuseum med äldre hus och lokalhistoria nära E16.','Kulturstopp utan stor omväg.','Bagn Bygdesamling'],
['Reinli stavkyrka',662,218,'kultur','25 till 50 min','Medeltida stavkyrka i högt läge över dalen.','Kort, stämningsfullt och historiskt rikt.','Reinli stavkirke'],
['Valdres Folkemuseum',760,145,'kultur','45 till 120 min','Stort friluftsmuseum vid Fagernes med historiska byggnader.','Dagens mest innehållsrika kulturstopp.','Valdres Folkemuseum Fagernes'],
['Hegge stavkyrka',838,80,'kultur','20 till 40 min','Medeltida stavkyrka nära vägen mot Beito.','Liten omväg med tydlig historisk kvalitet.','Hegge stavkirke Øystre Slidre'],
['Koselig hytte på Beito',860,66,'mål','Mål','Boendet på Lykkjetjednet 12. Incheckning 14 till 18.','Dagens mål.','Lykkjetjednet 12 Beitostølen'],
['Garli, Valdresflye',868,48,'utsikt','20 till 60 min','Början av den nationella turistvägen Valdresflye.','Fjällutsikt strax efter boendet.','Garli Valdresflye']];
const list=document.getElementById('list'),markers=document.getElementById('markers'),detail=document.getElementById('detail');
function renderTrips(){const q=document.getElementById('search').value.toLowerCase();list.innerHTML='';trips.filter(t=>[t.title,t.region,t.summary,...t.tags].join(' ').toLowerCase().includes(q)).forEach((t,i)=>{const e=document.createElement('article');e.className='entry active';e.innerHTML=`<h2>${t.title}</h2><div class="meta">${t.date} · ${t.region}</div><p class="summary">${t.summary}</p><div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`;list.appendChild(e)})}
function show(i){document.querySelectorAll('.marker').forEach(x=>x.classList.toggle('active',Number(x.dataset.i)===i));const s=stops[i];detail.innerHTML=`<h3>${s[0]}</h3><span class="badge">${s[3]} · ${s[4]}</span><p>${s[5]}</p><p><strong>Varför:</strong> ${s[6]}</p><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s[7])}">Öppna platsen</a>`}
stops.forEach((s,i)=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','marker');g.dataset.i=i;g.setAttribute('transform',`translate(${s[1]},${s[2]})`);g.innerHTML=`<circle r="12" class="halo"/><circle r="7" class="dot ${s[3]}"/><text x="14" y="-10">${s[0]}</text>`;g.onclick=()=>show(i);markers.appendChild(g)});document.getElementById('search').oninput=renderTrips;renderTrips();
</script>
</body>
</html>
