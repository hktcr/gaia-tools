<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skrivr — Distraktionsfri skrivyta</title>
<meta name="description" content="Distraktionsfri och minimalistisk markdown-editor med skrivmaskinsläge, fokusläge, teman och export. En del av gAIa Verktyg.">
<meta name="theme-color" content="#0a0a10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a10; --bg-2:#12121e; --bg-3:#1a1a2e;
  --accent:#6c63ff; --accent-2:#a855f7;
  --accent-soft:rgba(108,99,255,.14); --accent-glow:rgba(108,99,255,.30);
  --text:#e8e8f4; --text-dim:#9a9ac0; --text-muted:#5a5a7a;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
  --shadow:0 24px 60px rgba(0,0,0,.55);
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-serif:'Newsreader',Georgia,'Times New Roman',serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --write-font:var(--font-serif);
  --write-size:20px;
  --write-leading:1.85;
  --measure:46rem;
}
/* ---- Themes ---- */
body.theme-light{
  --bg:#f4f4f8; --bg-2:#ffffff; --bg-3:#eceaf6;
  --text:#1c1c2a; --text-dim:#5a5a72; --text-muted:#9a9ab0;
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14);
  --accent-soft:rgba(108,99,255,.12); --shadow:0 24px 60px rgba(40,40,80,.18);
}
body.theme-sepia{
  --bg:#efe6d4; --bg-2:#f6efe1; --bg-3:#e6dabf;
  --text:#403425; --text-dim:#7a6a52; --text-muted:#a8997e;
  --accent:#b5793b; --accent-2:#c98a3e; --accent-glow:rgba(181,121,59,.30);
  --accent-soft:rgba(181,121,59,.14);
  --border:rgba(80,50,20,.10); --border-strong:rgba(80,50,20,.18); --shadow:0 24px 60px rgba(90,60,20,.18);
}
body.theme-nord{
  --bg:#11151c; --bg-2:#171d27; --bg-3:#212a38;
  --accent:#88c0d0; --accent-2:#81a1c1; --accent-glow:rgba(136,192,208,.30);
  --accent-soft:rgba(136,192,208,.14);
  --text:#e5ebf2; --text-dim:#9aa7ba; --text-muted:#5e6a7e;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  background:var(--bg); color:var(--text);
  overflow:hidden;
  transition:background .4s ease,color .4s ease;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 18% -5%, var(--accent-soft) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 105%, rgba(52,211,153,.05) 0%, transparent 55%);
  opacity:1;transition:opacity .4s ease;
}
body.zen::before{opacity:.25}

.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);
  transition:opacity .35s ease,transform .35s ease;
  flex-shrink:0;
}
body.zen .topbar{opacity:0;transform:translateY(-100%);pointer-events:none;position:absolute;top:0;left:0;right:0}
body.zen:not(.no-hover) .topbar:hover,
body.zen .app:hover > .topbar{opacity:1;transform:translateY(0);pointer-events:auto}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex-shrink:0}
.brand-logo{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-size:18px;color:#fff;
  box-shadow:0 6px 18px var(--accent-glow);
}
.brand-name{font-weight:800;letter-spacing:-.3px;font-size:17px}
.brand-name b{background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.doc-title{
  flex:1;min-width:0;
  background:transparent;border:1px solid transparent;border-radius:9px;
  color:var(--text);font-family:var(--font-ui);font-weight:600;font-size:15px;
  padding:7px 12px;text-align:center;text-overflow:ellipsis;
  transition:.2s;
}
.doc-title:hover{background:var(--bg-2)}
.doc-title:focus{outline:none;border-color:var(--border-strong);background:var(--bg-2)}

.tools{display:flex;align-items:center;gap:6px;flex-shrink:0}

.seg{display:flex;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{
  border:none;background:transparent;color:var(--text-dim);
  font-family:var(--font-ui);font-size:13px;font-weight:600;
  padding:6px 11px;border-radius:7px;cursor:pointer;transition:.18s;
  display:flex;align-items:center;gap:6px;
}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--accent);color:#fff;box-shadow:0 3px 10px var(--accent-glow)}

.icon-btn{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  border:1px solid var(--border);background:var(--bg-2);color:var(--text-dim);
  cursor:pointer;display:grid;place-items:center;transition:.18s;font-size:16px;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--bg-3)}
.icon-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Format toolbar ---------- */
.fmtbar{
  display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap;
  padding:7px 16px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  flex-shrink:0;transition:opacity .35s,height .35s,padding .35s;
}
body.zen .fmtbar{opacity:0;height:0;padding:0;overflow:hidden;pointer-events:none;border:none}
.fmtbar button{
  min-width:34px;height:32px;padding:0 8px;border-radius:8px;
  border:1px solid transparent;background:transparent;color:var(--text-dim);
  font-family:var(--font-serif);font-size:15px;cursor:pointer;transition:.15s;
  display:grid;place-items:center;
}
.fmtbar button:hover{background:var(--bg-2);color:var(--text)}
.fmtbar button b{font-weight:800}
.fmtbar button i{font-style:italic}
.fmtbar .sep{width:1px;height:18px;background:var(--border);margin:0 5px}

/* ---------- Main ---------- */
.main{flex:1;min-height:0;display:flex;overflow:hidden;position:relative}
.pane{flex:1;min-width:0;overflow-y:auto;scroll-behavior:smooth}
.pane::-webkit-scrollbar{width:11px}
.pane::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
.pane::-webkit-scrollbar-thumb:hover{background:var(--text-muted);background-clip:padding-box}

.editor-pane{display:block}
.split-divider{width:1px;background:var(--border);flex-shrink:0}

#editor{
  display:block;width:100%;min-height:100%;
  max-width:var(--measure);margin:0 auto;
  padding:clamp(28px,7vh,84px) clamp(20px,5vw,48px) 42vh;
  background:transparent;border:none;outline:none;resize:none;
  color:var(--text);
  font-family:var(--write-font);
  font-size:var(--write-size);line-height:var(--write-leading);
  letter-spacing:.1px;caret-color:var(--accent);
  tab-size:4;
}
#editor::placeholder{color:var(--text-muted)}
body.typewriter #editor{padding-top:42vh;padding-bottom:42vh}

/* Preview */
.preview-pane{padding:0}
#preview{
  max-width:var(--measure);margin:0 auto;
  padding:clamp(28px,7vh,84px) clamp(20px,5vw,48px) 42vh;
  font-family:var(--write-font);font-size:var(--write-size);
  line-height:var(--write-leading);color:var(--text);
}
#preview h1,#preview h2,#preview h3,#preview h4{font-family:var(--font-ui);font-weight:800;line-height:1.25;letter-spacing:-.5px;margin:1.6em 0 .55em}
#preview h1{font-size:1.9em;margin-top:.2em}
#preview h2{font-size:1.5em}
#preview h3{font-size:1.22em}
#preview h4{font-size:1.05em;color:var(--text-dim)}
#preview p{margin:0 0 1.05em}
#preview a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
#preview a:hover{border-bottom-color:var(--accent)}
#preview strong{font-weight:700;color:var(--text)}
#preview em{font-style:italic}
#preview del{opacity:.6}
#preview ul,#preview ol{margin:0 0 1.05em;padding-left:1.4em}
#preview li{margin:.3em 0}
#preview li.task{list-style:none;margin-left:-1.4em;display:flex;gap:.55em;align-items:baseline}
#preview li.task input{accent-color:var(--accent);transform:translateY(1px)}
#preview blockquote{margin:0 0 1.1em;padding:.2em 0 .2em 1.1em;border-left:3px solid var(--accent);color:var(--text-dim);font-style:italic}
#preview code{font-family:var(--font-mono);font-size:.85em;background:var(--bg-3);padding:.15em .42em;border-radius:6px}
#preview pre{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:1em 1.2em;overflow-x:auto;margin:0 0 1.2em}
#preview pre code{background:none;padding:0;font-size:.85em;line-height:1.6}
#preview hr{border:none;height:1px;background:var(--border-strong);margin:2.2em 0}
#preview img{max-width:100%;border-radius:12px}
#preview table{border-collapse:collapse;width:100%;margin:0 0 1.2em;font-size:.92em}
#preview th,#preview td{border:1px solid var(--border-strong);padding:.5em .8em;text-align:left}
#preview th{background:var(--bg-2);font-family:var(--font-ui);font-weight:700}

/* Typewriter / focus overlays handled via JS line highlighting on textarea is hard;
   we dim using a subtle gradient mask instead */
body.focus #editor{color:var(--text-dim)}
body.focus #editor:focus{color:var(--text)}

/* ---------- Status bar ---------- */
.statusbar{
  display:flex;align-items:center;gap:18px;
  padding:8px 18px;border-top:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  font-size:12.5px;color:var(--text-dim);flex-shrink:0;
  transition:opacity .35s,transform .35s;
}
body.zen .statusbar{opacity:0;transform:translateY(100%);pointer-events:none;position:absolute;bottom:0;left:0;right:0}
.statusbar .grow{flex:1}
.stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.saved{display:flex;align-items:center;gap:6px}
.saved .dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);transition:.3s}
.saved.ok .dot{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.6)}
.statusbar a.ghost{color:var(--text-muted);text-decoration:none}
.statusbar a.ghost:hover{color:var(--accent)}

/* ---------- Drawer (documents) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:320px;max-width:85vw;z-index:50;
  background:var(--bg-2);border-right:1px solid var(--border-strong);
  box-shadow:var(--shadow);transform:translateX(-101%);transition:transform .34s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.show{transform:none}
.drawer-head{padding:18px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.drawer-head h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.drawer-list{flex:1;overflow-y:auto;padding:10px}
.doc-item{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;
  color:inherit;padding:11px 12px;border-radius:11px;cursor:pointer;margin-bottom:4px;transition:.15s;position:relative;
}
.doc-item:hover{background:var(--bg-3)}
.doc-item.active{background:var(--accent-soft);border-color:var(--accent)}
.doc-item .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.doc-item .m{font-size:11.5px;color:var(--text-dim);margin-top:3px}
.doc-item .del{position:absolute;top:9px;right:8px;width:24px;height:24px;border:none;background:transparent;color:var(--text-muted);border-radius:7px;cursor:pointer;opacity:0;transition:.15s;display:grid;place-items:center;font-size:15px}
.doc-item:hover .del{opacity:1}
.doc-item .del:hover{background:rgba(244,114,182,.18);color:#f472b6}
.drawer-foot{padding:12px;border-top:1px solid var(--border)}
.btn-primary{
  width:100%;border:none;border-radius:11px;padding:11px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-family:var(--font-ui);font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 18px var(--accent-glow);transition:.18s;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 9px 24px var(--accent-glow)}

/* ---------- Popover menu ---------- */
.pop{
  position:absolute;top:54px;right:14px;z-index:60;min-width:230px;
  background:var(--bg-2);border:1px solid var(--border-strong);border-radius:14px;
  box-shadow:var(--shadow);padding:7px;opacity:0;transform:translateY(-8px) scale(.97);
  pointer-events:none;transition:.2s;
}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop .label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);padding:9px 11px 5px;font-weight:700}
.pop button{
  width:100%;display:flex;align-items:center;gap:11px;
  border:none;background:transparent;color:var(--text);
  font-family:var(--font-ui);font-size:13.5px;font-weight:500;
  padding:9px 11px;border-radius:9px;cursor:pointer;transition:.13s;text-align:left;
}
.pop button:hover{background:var(--bg-3)}
.pop button .k{margin-left:auto;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.pop .row{display:flex;gap:5px;padding:4px 7px}
.pop .row button{justify-content:center;padding:8px 0;border:1px solid var(--border)}
.pop .swatch{width:26px;height:26px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.15s}
.pop .swatch:hover{transform:scale(1.1)}
.pop .swatch.sel{border-color:var(--text)}
.pop .divline{height:1px;background:var(--border);margin:6px 4px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:54px;transform:translate(-50%,16px);
  background:var(--bg-3);border:1px solid var(--border-strong);color:var(--text);
  padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.28s;z-index:80;
  display:flex;align-items:center;gap:9px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:720px){
  .brand-name{display:none}
  .seg button span{display:none}
  .statusbar{gap:12px;font-size:11.5px}
  .statusbar .hide-sm{display:none}
}
@media print{
  .topbar,.fmtbar,.statusbar,.drawer,.scrim,.pop,.toast{display:none!important}
  body,#preview{background:#fff;color:#000}
  .main{overflow:visible;display:block}
  .editor-pane{display:none!important}
  .preview-pane{display:block!important}
}
</style>
</head>
<body class="theme-dark">
<div class="app" id="app">

  <!-- Top bar -->
  <header class="topbar">
    <button class="icon-btn" id="btnDrawer" title="Dokument (Ctrl/⌘+O)" aria-label="Dokument">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="../index.html" title="Till gAIa Verktyg">
      <span class="brand-logo">✎</span>
      <span class="brand-name"><b>Skrivr</b></span>
    </a>
    <input class="doc-title" id="docTitle" value="Namnlöst dokument" spellcheck="false" aria-label="Dokumenttitel">
    <div class="tools">
      <div class="seg" id="viewSeg">
        <button data-view="write" class="active" title="Skriv (Ctrl/⌘+1)">✍️<span>Skriv</span></button>
        <button data-view="split" title="Delad vy (Ctrl/⌘+2)">▥<span>Delad</span></button>
        <button data-view="preview" title="Förhandsvisning (Ctrl/⌘+3)">👁<span>Visa</span></button>
      </div>
      <button class="icon-btn" id="btnTypewriter" title="Skrivmaskinsläge (Ctrl/⌘+T)">
        <svg viewBox="0 0 24 24"><path d="M4 17h16M7 13l-2 4M17 13l2 4M9 7h6M8 13h8M12 4v3"/></svg>
      </button>
      <button class="icon-btn" id="btnZen" title="Zen / fullskärm (Ctrl/⌘+Enter)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="btnMenu" title="Meny">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- Format toolbar -->
  <div class="fmtbar" id="fmtbar">
    <button data-md="h1" title="Rubrik 1">H1</button>
    <button data-md="h2" title="Rubrik 2">H2</button>
    <button data-md="h3" title="Rubrik 3">H3</button>
    <span class="sep"></span>
    <button data-md="bold" title="Fet (Ctrl/⌘+B)"><b>B</b></button>
    <button data-md="italic" title="Kursiv (Ctrl/⌘+I)"><i>I</i></button>
    <button data-md="strike" title="Genomstruken"><span style="text-decoration:line-through">S</span></button>
    <button data-md="code" title="Kod"><span style="font-family:var(--font-mono);font-size:13px">&lt;/&gt;</span></button>
    <span class="sep"></span>
    <button data-md="quote" title="Citat">❝</button>
    <button data-md="ul" title="Punktlista">•</button>
    <button data-md="ol" title="Numrerad lista">1.</button>
    <button data-md="task" title="Checklista">☑</button>
    <span class="sep"></span>
    <button data-md="link" title="Länk (Ctrl/⌘+K)">🔗</button>
    <button data-md="hr" title="Avdelare">―</button>
  </div>

  <!-- Main -->
  <div class="main" id="main">
    <div class="pane editor-pane" id="editorPane">
      <textarea id="editor" spellcheck="true" placeholder="Börja skriva…  Markdown stöds. Tryck Ctrl/⌘+Enter för zen-läge." autofocus></textarea>
    </div>
    <div class="split-divider" id="divider" style="display:none"></div>
    <div class="pane preview-pane" id="previewPane" style="display:none">
      <div id="preview"></div>
    </div>
  </div>

  <!-- Status bar -->
  <footer class="statusbar">
    <span class="stat"><b id="stWords">0</b> ord</span>
    <span class="stat hide-sm"><b id="stChars">0</b> tecken</span>
    <span class="stat hide-sm"><b id="stSent">0</b> meningar</span>
    <span class="stat"><b id="stRead">0</b> min läsning</span>
    <span class="grow"></span>
    <span class="saved" id="savedFlag"><span class="dot"></span><span id="savedTxt">Sparat</span></span>
    <a class="ghost hide-sm" href="../index.html">← gAIa Verktyg</a>
  </footer>
</div>

<!-- Documents drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3><span style="color:var(--accent)">▤</span> Dokument</h3>
    <button class="icon-btn" id="btnDrawerClose" style="width:30px;height:30px" aria-label="Stäng">✕</button>
  </div>
  <div class="drawer-list" id="docList"></div>
  <div class="drawer-foot">
    <button class="btn-primary" id="btnNew">＋ Nytt dokument</button>
  </div>
</aside>

<!-- Menu popover -->
<div class="pop" id="menu">
  <div class="label">Tema</div>
  <div class="row" id="themeRow">
    <div class="swatch" data-theme="dark"  title="Mörkt"  style="background:linear-gradient(135deg,#12121e,#6c63ff)"></div>
    <div class="swatch" data-theme="light" title="Ljust"  style="background:linear-gradient(135deg,#fff,#cdd)"></div>
    <div class="swatch" data-theme="sepia" title="Sepia"  style="background:linear-gradient(135deg,#efe6d4,#b5793b)"></div>
    <div class="swatch" data-theme="nord"  title="Nord"   style="background:linear-gradient(135deg,#171d27,#88c0d0)"></div>
  </div>
  <div class="label">Typsnitt</div>
  <div class="row" id="fontRow">
    <button data-font="serif" style="font-family:var(--font-serif)">Serif</button>
    <button data-font="ui" style="font-family:var(--font-ui)">Sans</button>
    <button data-font="mono" style="font-family:var(--font-mono);font-size:12px">Mono</button>
  </div>
  <div class="label">Textstorlek</div>
  <div class="row" id="sizeRow">
    <button data-size="17px">A−</button>
    <button data-size="20px">A</button>
    <button data-size="24px" style="font-size:17px">A＋</button>
  </div>
  <div class="divline"></div>
  <button id="mFocus"><span>🎯</span> Fokusläge <span class="k" id="kFocus">av</span></button>
  <div class="divline"></div>
  <div class="label">Exportera</div>
  <button id="eMd"><span>⤓</span> Markdown (.md) <span class="k">⌘S</span></button>
  <button id="eHtml"><span>⤓</span> HTML (.html)</button>
  <button id="eTxt"><span>⤓</span> Text (.txt)</button>
  <button id="eCopy"><span>⧉</span> Kopiera som HTML</button>
  <button id="ePrint"><span>🖨</span> Skriv ut / PDF <span class="k">⌘P</span></button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const LS='skrivr.docs.v1', LS_SET='skrivr.settings.v1';

/* ---------- State ---------- */
let docs=[], curId=null, saveTimer=null;
const ed=$('#editor'), prev=$('#preview'), title=$('#docTitle');

/* ---------- Settings ---------- */
const settings=Object.assign(
  {theme:'dark',font:'serif',size:'20px',typewriter:false,focus:false,view:'write'},
  JSON.parse(localStorage.getItem(LS_SET)||'{}')
);
function saveSettings(){localStorage.setItem(LS_SET,JSON.stringify(settings))}

/* ---------- Persistence ---------- */
function load(){
  try{docs=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){docs=[]}
  if(!Array.isArray(docs)||!docs.length){
    docs=[newDocObj('Välkommen till Skrivr', WELCOME)];
  }
  curId=docs[0].id;
}
function persist(){localStorage.setItem(LS,JSON.stringify(docs))}
function newDocObj(t,body){
  return {id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    title:t||'Namnlöst dokument', body:body||'', created:Date.now(), updated:Date.now()};
}
function current(){return docs.find(d=>d.id===curId)}

/* ---------- Markdown -> HTML (compact, self-contained) ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  // code spans first (protect)
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\uE000'+(codes.length-1)+'\uE000'});
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,'<img alt="$1" src="$2" title="$3">');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,'<a href="$2" title="$3" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\uE000(\d+)\uE000/g,(m,i)=>'<code>'+esc(codes[+i])+'</code>');
  return s;
}
function mdToHtml(src){
  const lines=src.replace(/\r\n?/g,'\n').split('\n');
  let html='', i=0;
  const para=[];
  const flush=()=>{ if(para.length){html+='<p>'+inline(para.join(' '))+'</p>'; para.length=0;} };
  while(i<lines.length){
    let ln=lines[i];
    // code fence
    const fence=ln.match(/^```(.*)$/);
    if(fence){ flush(); i++; let buf=[];
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue; }
    if(/^\s*$/.test(ln)){flush(); i++; continue;}
    let m;
    if(m=ln.match(/^(#{1,4})\s+(.*)$/)){flush(); html+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>'; i++; continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)){flush(); html+='<hr>'; i++; continue;}
    if(/^\s*>/.test(ln)){flush(); let buf=[];
      while(i<lines.length && /^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      html+='<blockquote>'+mdToHtml(buf.join('\n'))+'</blockquote>'; continue; }
    // tables
    if(/\|/.test(ln) && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      flush(); const head=splitRow(ln); i+=2; let rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && lines[i].trim()){rows.push(splitRow(lines[i]));i++;}
      html+='<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    // lists
    if(m=ln.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/)){flush();
      const ordered=/\d+\./.test(m[2]); const tag=ordered?'ol':'ul'; let items='';
      while(i<lines.length){
        const mm=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if(!mm) break;
        let txt=mm[3];
        const task=txt.match(/^\[([ xX])\]\s+(.*)$/);
        if(task){ items+='<li class="task"><input type="checkbox" disabled '+(task[1]!==' '?'checked':'')+'> '+inline(task[2])+'</li>'; }
        else items+='<li>'+inline(txt)+'</li>';
        i++;
      }
      html+='<'+tag+'>'+items+'</'+tag+'>'; continue;
    }
    para.push(ln.trim()); i++;
  }
  flush();
  return html;
}
function splitRow(s){return s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(x=>x.trim())}

/* ---------- Render / stats ---------- */
function renderPreview(){ prev.innerHTML=mdToHtml(ed.value); }
function updateStats(){
  const t=ed.value.trim();
  const words=t?t.split(/\s+/).filter(Boolean).length:0;
  const chars=ed.value.length;
  const sent=t?(t.match(/[.!?…]+(\s|$)/g)||[]).length||(words?1:0):0;
  $('#stWords').textContent=words.toLocaleString('sv-SE');
  $('#stChars').textContent=chars.toLocaleString('sv-SE');
  $('#stSent').textContent=sent.toLocaleString('sv-SE');
  $('#stRead').textContent=Math.max(words?1:0,Math.round(words/220));
}

/* ---------- Save ---------- */
function markDirty(){
  const f=$('#savedFlag'); f.classList.remove('ok'); $('#savedTxt').textContent='Sparar…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const d=current(); if(!d) return;
    d.body=ed.value; d.updated=Date.now(); persist();
    f.classList.add('ok'); $('#savedTxt').textContent='Sparat';
  },600);
}
function onInput(){ updateStats(); if($('#previewPane').style.display!=='none') renderPreview(); markDirty(); typewriterScroll(); }

/* ---------- Documents UI ---------- */
function openDoc(id){
  const d=docs.find(x=>x.id===id); if(!d) return;
  curId=id; ed.value=d.body; title.value=d.title;
  document.title='Skrivr — '+d.title;
  renderPreview(); updateStats(); renderDocList();
  $('#savedFlag').classList.add('ok'); $('#savedTxt').textContent='Sparat';
  ed.focus();
}
function renderDocList(){
  const list=$('#docList'); list.innerHTML='';
  [...docs].sort((a,b)=>b.updated-a.updated).forEach(d=>{
    const el=document.createElement('button');
    el.className='doc-item'+(d.id===curId?' active':'');
    const date=new Date(d.updated);
    const words=d.body.trim()?d.body.trim().split(/\s+/).length:0;
    el.innerHTML='<div class="t">'+escHtml(d.title||'Namnlöst')+'</div>'+
      '<div class="m">'+words+' ord · '+date.toLocaleDateString('sv-SE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</div>'+
      '<button class="del" title="Radera">🗑</button>';
    el.addEventListener('click',e=>{
      if(e.target.classList.contains('del')){e.stopPropagation();delDoc(d.id);return;}
      openDoc(d.id); closeDrawer();
    });
    list.appendChild(el);
  });
}
function escHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function delDoc(id){
  const d=docs.find(x=>x.id===id); if(!d) return;
  if(!confirm('Radera "'+(d.title||'Namnlöst')+'"?')) return;
  docs=docs.filter(x=>x.id!==id);
  if(!docs.length) docs=[newDocObj()];
  if(curId===id) openDoc(docs[0].id);
  persist(); renderDocList(); toast('Dokument raderat');
}
function newDoc(){
  const d=newDocObj(); docs.push(d); persist();
  openDoc(d.id); closeDrawer(); title.focus(); title.select();
}

/* ---------- Drawer ---------- */
function openDrawer(){renderDocList();$('#drawer').classList.add('show');$('#scrim').classList.add('show')}
function closeDrawer(){$('#drawer').classList.remove('show');$('#scrim').classList.remove('show')}

/* ---------- View ---------- */
function setView(v){
  settings.view=v; saveSettings();
  $$('#viewSeg button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  const epane=$('#editorPane'),ppane=$('#previewPane'),div=$('#divider');
  if(v==='write'){epane.style.display='block';epane.style.flex='1';ppane.style.display='none';div.style.display='none';}
  else if(v==='preview'){epane.style.display='none';ppane.style.display='block';ppane.style.flex='1';div.style.display='none';renderPreview();}
  else{epane.style.display='block';epane.style.flex='1';ppane.style.display='block';ppane.style.flex='1';div.style.display='block';renderPreview();}
}
function $$(s){return Array.from(document.querySelectorAll(s))}

/* ---------- Settings apply ---------- */
function applyTheme(t){
  settings.theme=t; saveSettings();
  document.body.className=document.body.className.replace(/theme-\w+/g,'').trim();
  document.body.classList.add('theme-'+t);
  document.querySelector('meta[name=theme-color]').setAttribute('content',getComputedStyle(document.body).getPropertyValue('--bg').trim());
  restoreModeClasses();
  $$('#themeRow .swatch').forEach(s=>s.classList.toggle('sel',s.dataset.theme===t));
}
function applyFont(f){
  settings.font=f; saveSettings();
  const map={serif:'var(--font-serif)',ui:'var(--font-ui)',mono:'var(--font-mono)'};
  document.documentElement.style.setProperty('--write-font',map[f]);
  $$('#fontRow button').forEach(b=>b.classList.toggle('sel',b.dataset.font===f));
}
function applySize(sz){
  settings.size=sz; saveSettings();
  document.documentElement.style.setProperty('--write-size',sz);
  $$('#sizeRow button').forEach(b=>b.classList.toggle('sel',b.dataset.size===sz));
}
function restoreModeClasses(){
  document.body.classList.toggle('typewriter',settings.typewriter);
  document.body.classList.toggle('focus',settings.focus);
  $('#btnTypewriter').classList.toggle('on',settings.typewriter);
  $('#kFocus').textContent=settings.focus?'på':'av';
}

/* ---------- Typewriter scroll ---------- */
function typewriterScroll(){
  if(!settings.typewriter) return;
  const pane=$('#editorPane');
  const pos=ed.selectionStart;
  // measure caret line via a mirror
  const before=ed.value.slice(0,pos);
  const lineCount=before.split('\n').length;
  const lh=parseFloat(getComputedStyle(ed).lineHeight)||30;
  const padTop=parseFloat(getComputedStyle(ed).paddingTop)||0;
  const caretY=padTop+(lineCount-1)*lh;
  const target=caretY-pane.clientHeight/2+lh/2;
  pane.scrollTo({top:Math.max(0,target),behavior:'smooth'});
}

/* ---------- Markdown insert helpers ---------- */
function wrap(pre,post){
  post=post??pre;
  const s=ed.selectionStart,e=ed.selectionEnd,val=ed.value,sel=val.slice(s,e);
  ed.value=val.slice(0,s)+pre+sel+post+val.slice(e);
  ed.selectionStart=s+pre.length; ed.selectionEnd=e+pre.length;
  ed.focus(); onInput();
}
function linePrefix(pre){
  const s=ed.selectionStart,val=ed.value;
  let ls=val.lastIndexOf('\n',s-1)+1;
  ed.value=val.slice(0,ls)+pre+val.slice(ls);
  ed.selectionStart=ed.selectionEnd=s+pre.length;
  ed.focus(); onInput();
}
function insertBlock(text){
  const s=ed.selectionStart,val=ed.value;
  const nl=(s>0&&val[s-1]!=='\n')?'\n':'';
  ed.value=val.slice(0,s)+nl+text+val.slice(s);
  ed.selectionStart=ed.selectionEnd=s+nl.length+text.length;
  ed.focus(); onInput();
}
function doMd(cmd){
  switch(cmd){
    case 'h1':linePrefix('# ');break;
    case 'h2':linePrefix('## ');break;
    case 'h3':linePrefix('### ');break;
    case 'bold':wrap('**');break;
    case 'italic':wrap('*');break;
    case 'strike':wrap('~~');break;
    case 'code':wrap('`');break;
    case 'quote':linePrefix('> ');break;
    case 'ul':linePrefix('- ');break;
    case 'ol':linePrefix('1. ');break;
    case 'task':linePrefix('- [ ] ');break;
    case 'link':{
      const s=ed.selectionStart,e=ed.selectionEnd,sel=ed.value.slice(s,e)||'text';
      const tpl='['+sel+'](https://)';
      ed.value=ed.value.slice(0,s)+tpl+ed.value.slice(e);
      ed.selectionStart=s+sel.length+3; ed.selectionEnd=s+sel.length+11;
      ed.focus(); onInput(); break;
    }
    case 'hr':insertBlock('\n---\n');break;
  }
}

/* ---------- Export ---------- */
function download(name,content,type){
  const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function slug(){return (current()?.title||'dokument').replace(/[^\wåäöÅÄÖ -]/g,'').trim().replace(/\s+/g,'-')||'dokument'}
function exportMd(){download(slug()+'.md',ed.value,'text/markdown');toast('Markdown exporterad')}
function exportTxt(){download(slug()+'.txt',ed.value,'text/plain');toast('Text exporterad')}
function fullHtml(){
  return '<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>'+escHtml(current()?.title||'Dokument')+'</title>'+
    '<style>body{max-width:720px;margin:48px auto;padding:0 22px;'+
    'font-family:Georgia,\'Times New Roman\',serif;font-size:19px;line-height:1.75;color:#1c1c2a}'+
    'h1,h2,h3,h4{font-family:system-ui,sans-serif;line-height:1.25}'+
    'a{color:#6c63ff}code{background:#f0f0f5;padding:.1em .4em;border-radius:4px;font-size:.85em}'+
    'pre{background:#f6f6fa;padding:1em;border-radius:8px;overflow:auto}'+
    'blockquote{border-left:3px solid #6c63ff;margin:0;padding-left:1em;color:#555;font-style:italic}'+
    'img{max-width:100%}table{border-collapse:collapse}th,td{border:1px solid #ccc;padding:.4em .7em}</style>'+
    '</head><body>'+mdToHtml(ed.value)+'</body></html>';
}
function exportHtml(){download(slug()+'.html',fullHtml(),'text/html');toast('HTML exporterad')}
function copyHtml(){
  const html=mdToHtml(ed.value);
  navigator.clipboard.writeText(html).then(()=>toast('HTML kopierad')).catch(()=>toast('Kunde inte kopiera'));
}
function printDoc(){renderPreview();setView('preview');setTimeout(()=>window.print(),120)}

/* ---------- Misc UI ---------- */
let toastTimer;
function toast(msg){const t=$('#toast');t.innerHTML='<span>✓</span> '+msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
function toggleMenu(force){const m=$('#menu');const show=force??!m.classList.contains('show');m.classList.toggle('show',show)}

/* ---------- Events ---------- */
ed.addEventListener('input',onInput);
ed.addEventListener('click',typewriterScroll);
ed.addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key))typewriterScroll()});
ed.addEventListener('scroll',()=>{ // sync split scroll
  if($('#previewPane').style.display==='block' && $('#divider').style.display==='block'){
    const pe=$('#editorPane'),pp=$('#previewPane');
    const ratio=pe.scrollTop/(pe.scrollHeight-pe.clientHeight||1);
    pp.scrollTop=ratio*(pp.scrollHeight-pp.clientHeight);
  }
});
// Tab inserts spaces
ed.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=ed.selectionStart;ed.value=ed.value.slice(0,s)+'    '+ed.value.slice(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+4;onInput();}
});

title.addEventListener('input',()=>{const d=current();if(d){d.title=title.value;d.updated=Date.now();document.title='Skrivr — '+d.title;persist();markDirty();}});
title.addEventListener('blur',renderDocList);

$$('#viewSeg button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#btnTypewriter').addEventListener('click',()=>{settings.typewriter=!settings.typewriter;saveSettings();restoreModeClasses();if(settings.typewriter)typewriterScroll()});
$('#btnZen').addEventListener('click',()=>document.body.classList.toggle('zen'));
$('#btnMenu').addEventListener('click',e=>{e.stopPropagation();toggleMenu()});
$('#btnDrawer').addEventListener('click',openDrawer);
$('#btnDrawerClose').addEventListener('click',closeDrawer);
$('#scrim').addEventListener('click',closeDrawer);
$('#btnNew').addEventListener('click',newDoc);
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#btnMenu'))toggleMenu(false)});

$('#fmtbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)doMd(b.dataset.md)});
$$('#themeRow .swatch').forEach(s=>s.addEventListener('click',()=>applyTheme(s.dataset.theme)));
$$('#fontRow button').forEach(b=>b.addEventListener('click',()=>applyFont(b.dataset.font)));
$$('#sizeRow button').forEach(b=>b.addEventListener('click',()=>applySize(b.dataset.size)));
$('#mFocus').addEventListener('click',()=>{settings.focus=!settings.focus;saveSettings();restoreModeClasses()});
$('#eMd').addEventListener('click',exportMd);
$('#eHtml').addEventListener('click',exportHtml);
$('#eTxt').addEventListener('click',exportTxt);
$('#eCopy').addEventListener('click',copyHtml);
$('#ePrint').addEventListener('click',printDoc);

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(!mod) {
    if(e.key==='Escape'){document.body.classList.remove('zen');closeDrawer();toggleMenu(false);}
    return;
  }
  const k=e.key.toLowerCase();
  const map={b:'bold',i:'italic',k:'link'};
  if(map[k]&&!e.shiftKey){e.preventDefault();doMd(map[k]);return;}
  if(k==='s'){e.preventDefault();exportMd();return;}
  if(k==='p'){e.preventDefault();printDoc();return;}
  if(k==='o'){e.preventDefault();$('#drawer').classList.contains('show')?closeDrawer():openDrawer();return;}
  if(k==='t'){e.preventDefault();settings.typewriter=!settings.typewriter;saveSettings();restoreModeClasses();return;}
  if(k==='enter'){e.preventDefault();document.body.classList.toggle('zen');return;}
  if(k==='1'){e.preventDefault();setView('write');return;}
  if(k==='2'){e.preventDefault();setView('split');return;}
  if(k==='3'){e.preventDefault();setView('preview');return;}
});

window.addEventListener('beforeunload',()=>{const d=current();if(d){d.body=ed.value;d.updated=Date.now();persist();}});

/* ---------- Boot ---------- */
const WELCOME=`# Välkommen till Skrivr ✎

En **distraktionsfri** skrivyta för tankar, utkast och texter — byggd för flow.

## Det här kan du göra
- Skriv i **Markdown** och se resultatet live i *delad vy* (Ctrl/⌘ + 2)
- Slå på **skrivmaskinsläge** så hålls raden du skriver på mitt på skärmen
- Gå in i **zen-läge** med Ctrl/⌘ + Enter — allt utom texten försvinner
- Allt sparas automatiskt i din webbläsare. Inget lämnar din dator.

## Snabbkommandon
| Tangent | Gör |
|---|---|
| Ctrl/⌘ + B / I | Fet / kursiv |
| Ctrl/⌘ + 1 / 2 / 3 | Skriv / Delad / Visa |
| Ctrl/⌘ + S | Exportera Markdown |
| Ctrl/⌘ + O | Öppna dokument |

> Tips: byt tema och typsnitt via menyn uppe till höger. Sepia är skönt för långa pass.

Lycka till — börja bara skriva. 🌱`;

load();
applyTheme(settings.theme);
applyFont(settings.font);
applySize(settings.size);
restoreModeClasses();
openDoc(curId);
setView(settings.view||'write');
updateStats();
})();
</script>
</body>
</html>
