amily="URW Gothic" font-size="21" font-weight="400" fill="#19354b">berättelse. Forskarnas eget verktyg.</text><text x="64" y="589.00" font-family="URW Gothic" font-size="20" font-weight="400" fill="#4e6574">Båda: indexerade originalavsnitt lästa. Fullständiga tabeller och bilagor inte verifierade.</text><text x="64" y="634.00" font-family="URW Gothic" font-size="22" font-weight="700" fill="#19354b">Riktat och utformat stöd kan fungera annorlunda än en öppen chatbot.</text><text x="64" y="48.00" font-family="URW Gothic" font-size="17" font-weight="700" fill="#3d667c">03 / LÄRANDE</text><path d="M64,65 L1216,65" fill="none" stroke="#d3dbdc" stroke-width="2"/><path d="M64,674 L1216,674" fill="none" stroke="#d3dbdc" stroke-width="2"/><text x="64" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">Rapport s. 7 och 8 • Cao [N09] och Xiao [N10]</text><text x="1165" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">12 / 18</text></svg></section><section class="export-page" data-index="12" data-type="steps" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Gör elevens egen bearbetning synlig"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f7f3e9"/><text x="64" y="124.00" font-family="URW Gothic" font-size="39" font-weight="700" fill="#19354b">Gör elevens egen bearbetning synlig</text><text x="64" y="233.00" font-family="URW Gothic" font-size="55" font-weight="700" fill="#3d667c">01</text><path d="M64,261 L404,261" fill="none" stroke="#3d667c" stroke-width="2"/><text x="64" y="310.00" font-family="URW Gothic" font-size="31" font-weight="700" fill="#19354b">Eget försök</text><text x="64" y="367.00" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">En förklaring eller lösning.</text><text x="456" y="233.00" font-family="URW Gothic" font-size="55" font-weight="700" fill="#3d667c">02</text><path d="M456,261 L796,261" fill="none" stroke="#3d667c" stroke-width="2"/><text x="456" y="310.00" font-family="URW Gothic" font-size="31" font-weight="700" fill="#19354b">Riktat stöd</text><text x="456" y="367.00" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">Granska och motivera</text><text x="456" y="403.40" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">en omarbetning.</text><text x="848" y="233.00" font-family="URW Gothic" font-size="55" font-weight="700" fill="#3d667c">03</text><path d="M848,261 L1188,261" fill="none" stroke="#3d667c" stroke-width="2"/><text x="848" y="310.00" font-family="URW Gothic" font-size="31" font-weight="700" fill="#19354b">Ny uppgift</text><text x="848" y="367.00" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">Utan AI. Följ upp senare</text><text x="848" y="403.40" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">om målet är beständig</text><text x="848" y="439.80" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">kunskap.</text><text x="64" y="634.00" font-family="URW Gothic" font-size="22" font-weight="700" fill="#19354b">Ett förslag att pröva, inte en bevisat bästa metod. Behåll nödvändiga stödinsatser.</text><text x="64" y="48.00" font-family="URW Gothic" font-size="17" font-weight="700" fill="#3d667c">03 / LÄRANDE</text><path d="M64,65 L1216,65" fill="none" stroke="#d3dbdc" stroke-width="2"/><path d="M64,674 L1216,674" fill="none" stroke="#d3dbdc" stroke-width="2"/><text x="64" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">Rapport s. 5 och 10 • Praktisk syntes, inte ett färdigprövat undervisningsprogram</text><text x="1165" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">13 / 18</text></svg></section><section class="export-page" data-index="13" data-type="divider" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height=" 6,343 L796,343" fill="none" stroke="#706039" stroke-width="2"/><text x="848" y="271.00" font-family="URW Gothic" font-size="78" font-weight="700" fill="#706039">20</text><text x="848" y="315.00" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">planer med AI-träffar</text><path d="M848,343 L1188,343" fill="none" stroke="#706039" stroke-width="2"/><text x="64" y="403.00" font-family="URW Gothic" font-size="29" font-weight="700" fill="#19354b">1 390 sidor textsökta. AI-träffarna lästa i sitt sammanhang.</text><text x="64" y="475.00" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">Dokumentinventering och riktad innehållskontroll. Ingen full vetenskaplig</text><text x="64" y="511.40" font-family="URW Gothic" font-size="28" font-weight="400" fill="#19354b">granskning av samtliga sidor.</text><text x="64" y="563.00" font-family="URW Gothic" font-size="25" font-weight="400" fill="#4e6574">Lokalt: när ska stöd ges, hur syns eget bidrag och vem får nytta av stödet?</text><text x="64" y="634.00" font-family="URW Gothic" font-size="22" font-weight="700" fill="#19354b">Tillgång till AI, faktisk användning och nytta är tre olika steg.</text><text x="64" y="48.00" font-family="URW Gothic" font-size="17" font-weight="700" fill="#706039">04 / REMISSFÖRSLAG</text><path d="M64,65 L1216,65" fill="none" stroke="#d3dbdc" stroke-width="2"/><path d="M64,674 L1216,674" fill="none" stroke="#d3dbdc" stroke-width="2"/><text x="64" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">Rapport s. 5 till 7 och 9 • R2 till R25 • Förslag med skolformsbundna formuleringar</text><text x="1165" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">16 / 18</text></svg></section><section class="export-page" data-index="16" data-type="cards" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Tre kontroller innan vi drar slutsatsen"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f7f3e9"/><text x="64" y="124.00" font-family="URW Gothic" font-size="39" font-weight="700" fill="#19354b">Tre kontroller innan vi drar slutsatsen</text><rect x="64" y="180" width="368" height="350" rx="18" fill="#ecf0ed"/><text x="88" y="222.00" font-family="URW Gothic" font-size="19" font-weight="700" fill="#706039">Bedömningen</text><text x="88" y="274.00" font-family="URW Gothic" font-size="28" font-weight="700" fill="#19354b">Vilka skillnader döljs?</text><text x="88" y="365.00" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">Granska nivåer, kriterier</text><text x="88" y="396.75" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">och enskilda svar, även</text><text x="88" y="428.50" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">den mänskliga referensen.</text><rect x="456" y="180" width="368" height="350" rx="18" fill="#ecf0ed"/><text x="480" y="222.00" font-family="URW Gothic" font-size="19" font-weight="700" fill="#706039">Arbetskedjan</text><text x="480" y="274.00" font-family="URW Gothic" font-size="28" font-weight="700" fill="#19354b">Vad räknas som vinst?</text><text x="480" y="365.00" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">Skilj färdig produkt,</text><text x="480" y="396.75" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">lärartid, elevtid och</text><text x="480" y="428.50" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">självständigt lärande.</text><rect x="848" y="180" width="368" height="350" rx="18" fill="#ecf0ed"/><text x="872" y="222.00" font-family="URW Gothic" font-size="19" font-weight="700" fill="#706039">Eleven</text><text x="872" y="274.00" font-family="URW Gothic" font-size="28" font-weight="700" fill="#19354b">Vad kan och upplever</text><text x="872" y="310.40" font-family="URW Gothic" font-size="28" font-weight="700" fill="#19354b">eleven?</text><text x="872" y="365.00" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">Kontrollera eget</text><text x="872" y="396.75" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">kunnande. Fråga också</text><text x="872" y="428.50" font-family="URW Gothic" font-size="25" font-weight="400" fill="#19354b">om stöd, tillit och rättvisa.</text><text x="64" y="634.00" font-family="URW Gothic" font-size="22" font-weight="700" fill="#19354b">Välj en avgränsad fråga att pröva lokalt och bestäm vad som skulle ändra vår uppfattning.</text><text x="64" y="48.00" font-family="URW Gothic" font-size="17" font-weight="700" fill="#706039">FRÅN RESULTAT TILL UNDERVISNING</text><path d="M64,65 L1216,65" fill="none" stroke="#d3dbdc" stroke-width="2"/><path d="M64,674 L1216,674" fill="none" stroke="#d3dbdc" stroke-width="2"/><text x="64" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">Rapport s. 1, 9 och 10 • Syntes och diskussionsförslag</text><text x="1165" y="701.00" font-family="URW Gothic" font-size="15" font-weight="400" fill="#4e6574">17 / 18</text></svg></section><section class="export-page" data-index="17" data-type="closing" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Vad vill vi att eleven
