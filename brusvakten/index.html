<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brusvakten - Akustisk Spegling</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-color: #38bdf8;
            --danger-color: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-blur: blur(12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(244, 63, 94, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--surface-color);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .visualizer {
            position: relative;
            height: 120px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 0;
        }

        .level-bar {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, var(--primary-color), var(--danger-color));
            transition: height 0.1s ease-out;
            opacity: 0.8;
        }

        .threshold-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
            transition: bottom 0.3s ease;
            z-index: 2;
        }

        .threshold-line::after {
            content: 'Tröskelvärde';
            position: absolute;
            right: 10px;
            top: -20px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .value-display {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .type-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .type-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .action-btn {
            margin-top: 20px;
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(255, 255, 255, 0.3);
        }

        .action-btn.active {
            background: rgba(244, 63, 94, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        
        .action-btn.active:hover {
            box-shadow: 0 10px 20px -10px rgba(244, 63, 94, 0.3);
        }

        /* Ambient glow effect based on noise volume */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, var(--primary-color) 0%, transparent 70%);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
            mix-blend-mode: screen;
        }

        #waterCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            background-color: #020617;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #waterCanvas.active {
            opacity: 1;
            pointer-events: auto;
            cursor: none;
        }

    </style>
</head>
<body>

    <canvas id="waterCanvas"></canvas>
    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="container">
        <header>
            <h1>Brusvakten</h1>
            <p class="subtitle">Akustisk spegling för klassrummet</p>
        </header>

        <div class="visualizer">
            <div class="threshold-line" id="thresholdLine" style="bottom: 50%;"></div>
            <div class="level-bar" id="levelBar"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-header">
                    <label for="thresholdSlider">Acceptabel Ljudnivå (Tröskel)</label>
                    <span class="value-display" id="thresholdDisplay">50%</span>
                </div>
                <input type="range" id="thresholdSlider" min="1" max="100" value="50">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <label for="maxVolumeSlider">Maximal Brusvolym</label>
                    <span class="value-display" id="maxVolumeDisplay">70%</span>
                </div>
                <input type="range" id="maxVolumeSlider" min="0" max="100" value="70">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <label for="sensitivitySlider">Ökningstakt</label>
                    <span class="value-display" id="sensitivityDisplay">Medel</span>
                </div>
                <input type="range" id="sensitivitySlider" min="1" max="10" value="5">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <label for="sustainSlider">Efterklang (Hålltid)</label>
                    <span class="value-display" id="sustainDisplay">5s</span>
                </div>
                <input type="range" id="sustainSlider" min="0" max="15" value="5">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <label for="fadeOutSlider">Utklingning (Fade-out)</label>
                    <span class="value-display" id="fadeOutDisplay">2s</span>
                </div>
                <input type="range" id="fadeOutSlider" min="1" max="10" value="2">
            </div>

            <div class="control-group">
                <label>Bruskaraktär</label>
                <div class="type-selector">
                    <button class="type-btn active" data-type="brown">Brunt (Dovt)</button>
                    <button class="type-btn" data-type="pink">Rosa (Mjukt)</button>
                    <button class="type-btn" data-type="white">Vitt (Skarpt)</button>
                </div>
            </div>

            <button class="action-btn" id="toggleBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>
                <span>Aktivera Mikrofon & Brus</span>
            </button>
            <button class="action-btn" id="fullscreenBtn" style="margin-top: 0; background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border-color);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <span style="font-size: 0.9rem;">Helskärm (Visuellt Vattenläge)</span>
            </button>
            <button class="action-btn" id="resetNoiseBtn" style="margin-top: 0; background: rgba(251, 191, 36, 0.08); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); font-size: 0.9rem;" title="Nollställ bruset manuellt om det fastnar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                <span>Nollställ brus</span>
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdDisplay = document.getElementById('thresholdDisplay');
        const thresholdLine = document.getElementById('thresholdLine');
        
        const maxVolumeSlider = document.getElementById('maxVolumeSlider');
        const maxVolumeDisplay = document.getElementById('maxVolumeDisplay');

        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const sensitivityDisplay = document.getElementById('sensitivityDisplay');

        const sustainSlider = document.getElementById('sustainSlider');
        const sustainDisplay = document.getElementById('sustainDisplay');

        const fadeOutSlider = document.getElementById('fadeOutSlider');
        const fadeOutDisplay = document.getElementById('fadeOutDisplay');
        
        const typeBtns = document.querySelectorAll('.type-btn');
        const toggleBtn = document.getElementById('toggleBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const resetNoiseBtn = document.getElementById('resetNoiseBtn');
        const levelBar = document.getElementById('levelBar');
        const ambientGlow = document.getElementById('ambientGlow');
        const canvas = document.getElementById('waterCanvas');
        const ctx = canvas.getContext('2d');

        // Audio State
        let audioContext;
        let micStream;
        let analyser;
        let noiseNode;
        let gainNode;
        let filterNode; // For pink/brown noise shaping
        
        let isActive = false;
        let currentNoiseType = 'brown';
        let animationFrameId;

        // Settings
        let threshold = 0.5;
        let maxNoiseVolume = 0.7;
        let responseExponent = 1.5; // High = slow ramp, Low = immediate
        let sustainTime = 5; // seconds
        let fadeOutTime = 2; // seconds
        
        let currentNoiseLevel = 0;
        let peakHoldTimer = 0;

        // UI Updates
        thresholdSlider.addEventListener('input', (e) => {
            threshold = e.target.value / 100;
            thresholdDisplay.textContent = e.target.value + '%';
            thresholdLine.style.bottom = e.target.value + '%';
        });

        maxVolumeSlider.addEventListener('input', (e) => {
            maxNoiseVolume = e.target.value / 100;
            maxVolumeDisplay.textContent = e.target.value + '%';
        });

        const sensitivityLabels = ['', 'Mycket mjuk', 'Mjuk', 'Mjuk', 'Medel', 'Medel', 'Snabb', 'Snabb', 'Omedelbar', 'Omedelbar', 'Blixtsnabb'];
        sensitivitySlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            // Map 1–10 → exponent 3.5 → 0.3 (inverted: high sensitivity = low exponent)
            responseExponent = 3.5 - (val - 1) * (3.2 / 9);
            sensitivityDisplay.textContent = sensitivityLabels[val];
        });

        sustainSlider.addEventListener('input', (e) => {
            sustainTime = parseInt(e.target.value);
            sustainDisplay.textContent = sustainTime + 's';
        });

        fadeOutSlider.addEventListener('input', (e) => {
            fadeOutTime = parseInt(e.target.value);
            fadeOutDisplay.textContent = fadeOutTime + 's';
        });

        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentNoiseType = btn.dataset.type;
                if (isActive) {
                    updateNoiseType();
                }
            });
        });

        toggleBtn.addEventListener('click', async () => {
            if (!isActive) {
                await startSystem();
            } else {
                stopSystem();
            }
        });

        // Canvas & Fullscreen Logic
        let isWaterMode = false;
        let ripples = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        fullscreenBtn.addEventListener('click', async () => {
            if (!isActive) {
                await startSystem();
            }
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Kunde inte starta helskärm: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        resetNoiseBtn.addEventListener('click', () => {
            currentNoiseLevel = 0;
            peakHoldTimer = 0;
            if (gainNode) gainNode.gain.setTargetAtTime(0, audioContext.currentTime, 0.3);
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                isWaterMode = true;
                canvas.classList.add('active');
            } else {
                isWaterMode = false;
                canvas.classList.remove('active');
            }
        });

        async function startSystem() {
            try {
                // Init Audio Context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Get Mic Stream
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const source = audioContext.createMediaStreamSource(micStream);
                
                // Setup Analyser
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.6; // Less sluggish than 0.8
                source.connect(analyser);

                // Setup Noise Generator & Gain
                createNoiseGenerator();

                // UI Update
                isActive = true;
                toggleBtn.classList.add('active');
                toggleBtn.querySelector('span').textContent = 'Inaktivera System';
                
                // Start Loop
                analyzeAudio();

            } catch (err) {
                console.error('Kunde inte starta mikrofonen:', err);
                alert('Behöver tillgång till mikrofonen för att fungera.');
            }
        }

        function stopSystem() {
            isActive = false;
            cancelAnimationFrame(animationFrameId);
            
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }

            // UI Update
            toggleBtn.classList.remove('active');
            toggleBtn.querySelector('span').textContent = 'Aktivera Mikrofon & Brus';
            levelBar.style.height = '0%';
            ambientGlow.style.opacity = '0';
        }

        function createNoiseGenerator() {
            // Create an empty buffer (2 seconds of audio)
            const bufferSize = audioContext.sampleRate * 2;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);

            // Generate raw white noise
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioContext.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            // Setup Filter for Brown/Pink noise simulation
            filterNode = audioContext.createBiquadFilter();
            updateNoiseType();

            // Setup Gain Node (Volume control)
            gainNode = audioContext.createGain();
            gainNode.gain.value = 0; // Start silent

            // Connect: Noise -> Filter -> Gain -> Destination
            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioContext.destination);

            noiseNode.start();
        }

        function updateNoiseType() {
            if (!filterNode) return;
            
            // Simple approximations using a BiquadFilter
            switch (currentNoiseType) {
                case 'white':
                    filterNode.type = 'allpass';
                    break;
                case 'pink':
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 800;
                    break;
                case 'brown':
                    filterNode.type = 'lowpass';
                    filterNode.frequency.value = 400;
                    break;
            }
        }

        function analyzeAudio() {
            if (!isActive) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            // True RMS for perceptual loudness
            let sumSq = 0;
            for (let i = 0; i < dataArray.length; i++) sumSq += dataArray[i] * dataArray[i];
            let micLevel = Math.sqrt(sumSq / dataArray.length) / 255;
            micLevel = Math.min(1, Math.pow(micLevel, 0.7)); // gentle compression

            // UI Bar
            levelBar.style.height = `${micLevel * 100}%`;
            levelBar.style.background = micLevel > threshold
                ? 'linear-gradient(to top, var(--danger-color), #ef4444)'
                : 'linear-gradient(to top, var(--primary-color), #8b5cf6)';

            // Raw desired gain from current mic
            let rawTargetGain = 0;
            if (micLevel > threshold) {
                const overage = (micLevel - threshold) / (1 - threshold);
                rawTargetGain = Math.pow(overage, responseExponent) * maxNoiseVolume;
            }

            // Asymmetric envelope:
            if (micLevel > threshold) {
                if (rawTargetGain > currentNoiseLevel) {
                    currentNoiseLevel = rawTargetGain; // instant attack, never goes down here
                }
                // While above threshold: level only moves up. Nollställ-knapp för manuell reset.
                peakHoldTimer = Math.round(sustainTime * 60);
            } else {
                if (peakHoldTimer > 0) {
                    peakHoldTimer--;
                } else {
                    // Linear decay based on max volume (avoids Zeno's paradox / infinite tail)
                    const decayPerFrame = maxNoiseVolume / Math.max(1, fadeOutTime * 60);
                    currentNoiseLevel = Math.max(0, currentNoiseLevel - decayPerFrame);
                }
            }

            gainNode.gain.setTargetAtTime(currentNoiseLevel, audioContext.currentTime, 0.05);
            ambientGlow.style.opacity = currentNoiseLevel * 0.5;

            // WATER CANVAS
            if (isWaterMode) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.08)'; // Slightly longer trails for smoother water effect
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Determine visual state
                let visualState = 'quiet';
                if (micLevel > threshold) visualState = 'loud';
                else if (currentNoiseLevel > 0.01) visualState = 'sustaining';

                // Spawn logic: Base spawn rate on mic level + baseline if noise is sustaining
                let spawnProb = micLevel * 2.5;
                if (visualState === 'loud') spawnProb += 1; // Guarantee at least 1 drop per frame when loud
                else if (visualState === 'sustaining') spawnProb += 0.3; // Keep drops active while noise plays

                let dropsToSpawn = Math.floor(spawnProb);
                if (Math.random() < (spawnProb - dropsToSpawn)) dropsToSpawn++;

                for (let d = 0; d < dropsToSpawn; d++) {
                    let color = '56, 189, 248'; // Cyan
                    let alpha = 0.4;
                    if (visualState === 'loud') {
                        color = '244, 63, 94'; // Red
                        alpha = 0.8;
                    } else if (visualState === 'sustaining') {
                        color = '251, 191, 36'; // Amber
                        alpha = 0.6;
                    }

                    // Intensity affects size and speed
                    let intensity = Math.max(micLevel, currentNoiseLevel * 0.5);

                    ripples.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: 1,
                        maxRadius: 30 + intensity * 400,
                        speed: 0.5 + intensity * 5,
                        alpha: alpha,
                        color: color
                    });
                }

                for (let i = ripples.length - 1; i >= 0; i--) {
                    const r = ripples[i];
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${r.color}, ${r.alpha})`;
                    ctx.lineWidth = Math.max(0.5, 2 - (r.radius / r.maxRadius));
                    ctx.stroke();
                    r.radius += r.speed;
                    // Linear fade based on radius progress
                    r.alpha -= (r.speed / r.maxRadius) * 0.8;
                    if (r.alpha <= 0 || r.radius > r.maxRadius) ripples.splice(i, 1);
                }

                // Safety cap to prevent memory leak
                if (ripples.length > 400) ripples.splice(0, ripples.length - 400);
            }

            animationFrameId = requestAnimationFrame(analyzeAudio);
        }
    </script>
</body>
</html>
