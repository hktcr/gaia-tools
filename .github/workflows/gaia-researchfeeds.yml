name: GAIA research feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: read

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run configured feeds
        env:
          PYTHONPATH: gaia-execution
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          mkdir -p gaia-execution/output
          python -m gaia_exec feeds gaia-execution/config/research_feeds.json --output gaia-execution/output/research-feeds.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaia-research-feeds
          path: gaia-execution/output/research-feeds.json
          if-no-files-found: error
          retention-days: 30
