name: Meeting pages checks
on:
  push:
    branches: [main, work/ai-mote-2026-11-11]
    paths: ['moten/**', '.github/workflows/moten-check.yml']
permissions:
  contents: read
jobs:
  browser-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - name: Check integrity, links and responsive layout
        run: node moten/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meeting-page-chrome
          path: moten-test-output
          retention-days: 7
