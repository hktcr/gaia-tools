name: Responsive presentation checks
on:
  push:
    branches: [main, 'work/ai-presentation-2026-11-11-responsive*']
    paths: ['moten/ai-2026-11-11/presentation/responsive-r9/**', 'moten/presentation-responsive-check.mjs', '.github/workflows/presentation-responsive-check.yml']
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chrome
      - run: node moten/presentation-responsive-check.mjs moten/ai-2026-11-11/presentation/responsive-r9/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-presentation-chrome
          path: responsive-artifacts
          retention-days: 7
