name: Ellära från åska preflight
on:
  push:
    branches: ['work/ellara-fran-aska-preflight']
    paths: ['ellara-fran-aska/**', '.github/workflows/ellara-fran-aska-preflight.yml']
permissions:
  contents: read
jobs:
  responsive-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: google-chrome --version
      - run: node ellara-fran-aska/preflight.cjs
