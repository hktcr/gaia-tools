name: AI presentation browser checks
on:
  push:
    branches: [main, 'work/ai-presentation-2026-11-11*']
    paths: ['moten/ai-2026-11-11/presentation/**', 'moten/presentation-check.mjs', '.github/workflows/presentation-check.yml']
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chrome
      - run: node moten/presentation-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-presentation-chrome
          path: presentation-test-output
          retention-days: 7
